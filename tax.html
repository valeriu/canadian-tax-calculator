<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canadian Tax Calculator</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --border: #d1d5db;
        --danger: #b91c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
        background: linear-gradient(180deg, #edf3fa, var(--bg));
        color: var(--text);
      }

      .calculator {
        max-width: 440px;
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.2rem;
      }

      .field {
        margin-bottom: 12px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.92rem;
        font-weight: 600;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
      }

      .error {
        min-height: 18px;
        color: var(--danger);
        font-size: 0.85rem;
      }

      .results {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 8px 0;
      }

      .row .label {
        color: var(--muted);
      }

      .row.total {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
        font-weight: 700;
      }

      .meta {
        margin-top: 12px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      button {
        margin-top: 12px;
        width: auto;
        min-width: 120px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f8fafc;
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }

      button:hover {
        background: #eef2f7;
        border-color: #9ca3af;
      }

      button:focus {
        outline: none;
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="calculator">
      <h1 data-i18n="title">Canadian Tax Calculator</h1>

      <div class="field">
        <label for="language" data-i18n="languageLabel">Language</label>
        <select name="language" id="language">
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </div>

      <div class="field">
        <label for="price" data-i18n="priceLabel">Price (CAD)</label>
        <input
          id="price"
          name="price"
          type="text"
          inputmode="decimal"
          placeholder="e.g. 100.00"
          data-i18n-placeholder="pricePlaceholder"
        />
      </div>

      <div class="field">
        <label for="province" data-i18n="provinceLabel">Province or territory</label>
        <select name="province" id="province"></select>
      </div>

      <p id="error" class="error" aria-live="polite"></p>

      <section class="results" aria-live="polite">
        <div class="row">
          <span class="label" data-i18n="basePriceLine">Price before taxes</span>
          <strong id="base-price">$0.00</strong>
        </div>
        <div class="row">
          <span class="label" id="federal-tax-label">Federal tax (GST/HST)</span>
          <strong id="gst">$0.00</strong>
        </div>
        <div class="row">
          <span class="label" id="provincial-tax-label">Provincial tax (PST/QST/RST)</span>
          <strong id="pst">$0.00</strong>
        </div>
        <div class="row">
          <span class="label" data-i18n="totalTaxLine">Total taxes</span>
          <strong id="total-tax">$0.00</strong>
        </div>
        <div class="row total">
          <span class="label" data-i18n="finalPriceLine">Price after taxes</span>
          <strong id="final-price">$0.00</strong>
        </div>
      </section>

      <button id="reset" type="button" data-i18n="resetButton">Reset</button>
      <p id="tax-model" class="meta"></p>
      <p id="rates-note" class="meta"></p>
    </main>

    <script src="i18n.js"></script>
    <script src="tax-data.js"></script>
    <script src="tax.js"></script>
  </body>
</html>
